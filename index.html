<!doctype html>
<html lang="ko" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>빗소리 서재</title>
    <meta name="description" content="빗소리와 함께 책 읽는 시간을 재고 기록하는 독서 타이머" />
    <!-- 주소창 색. 테마에 맞춰 바꾸는 일은 9단계(TH-07)에서 합니다. -->
    <meta name="theme-color" content="#F1EADD" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="빗소리 서재" />
    <script>
      // 첫 화면을 그리기 전에 저장된 테마를 적용합니다(깜빡임 방지). 값이 없으면 paper.
      (function () {
        var theme = 'paper';
        try {
          var saved = localStorage.getItem('rl-theme');
          if (saved === 'paper' || saved === 'emerald') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

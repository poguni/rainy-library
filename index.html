<!doctype html>
<html lang="ko" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>빗소리 서재</title>
    <meta name="description" content="빗소리와 함께 책 읽는 시간을 재고 기록하는 독서 타이머" />
    <!-- 주소창 색. 아래 스크립트와 src/theme/applyTheme.ts가 테마에 맞춰 바꿉니다(TH-07). -->
    <meta name="theme-color" content="#F1EADD" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="빗소리 서재" />
    <script>
      // 첫 화면을 그리기 전에 저장된 테마를 적용합니다(깜빡임 방지, DESIGN.md 10장).
      // 규칙은 src/lib/theme.ts의 resolveTheme과 같습니다(바꿀 때 함께 고칠 것).
      (function () {
        var theme = 'paper';
        try {
          var choice = localStorage.getItem('rl-theme');
          if (choice === 'paper' || choice === 'emerald') theme = choice;
          if (choice === 'auto') {
            var auto = JSON.parse(localStorage.getItem('rl-theme-auto') || '{}');
            var night;
            if (auto.rule === 'schedule') {
              var mins = function (t) {
                var p = String(t || '').split(':');
                return (+p[0] || 0) * 60 + (+p[1] || 0);
              };
              var d = new Date();
              var now = d.getHours() * 60 + d.getMinutes();
              var s = mins(auto.nightStart || '19:00');
              var e = mins(auto.nightEnd || '07:00');
              night = s === e ? false : s < e ? now >= s && now < e : now >= s || now < e;
            } else {
              night = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            theme = night ? 'emerald' : 'paper';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        // 주소창 색(tokens.css의 --theme-color-meta와 같은 값)
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'emerald' ? '#0D231E' : '#F1EADD');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
